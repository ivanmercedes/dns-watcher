name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test -v ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/dns-watcher-windows-amd64.exe .
          GOOS=windows GOARCH=386   go build -trimpath -ldflags="-s -w" -o dist/dns-watcher-windows-386.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/dns-watcher-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/dns-watcher-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/dns-watcher-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/dns-watcher-darwin-arm64 .
          (cd dist && sha256sum * > checksums.txt)

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
